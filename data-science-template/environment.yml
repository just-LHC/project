# UV Environment Setup Instructions
#  - Using requirements.txt with uv
#  - Key Terminal Commands:
#
#    Create environment:    uv venv --python 3.12
#    Activate (Windows):    .venv\Scripts\activate
#    Install dependencies:  uv pip install -r requirements.txt
#    Update/Prune to match: uv pip sync requirements.txt
#    Export dependencies:   uv pip freeze > requirements.txt
#    Delete environment:    Remove-Item -Recurse -Force .venv

